name: Release

# Push a tag like v0.1.0 to build the Android APKs and the Windows app and publish a GitHub Release:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Optional repository configuration (Settings -> Secrets and variables -> Actions):
#   Variable  REMODROID_SIGNALING_URL      default server URL baked into the apps (wss://.../ws)
#   Secret    ANDROID_KEYSTORE_BASE64      base64 of your release .jks keystore
#   Secret    ANDROID_KEYSTORE_PASSWORD
#   Secret    ANDROID_KEY_ALIAS
#   Secret    ANDROID_KEY_PASSWORD
# Without the keystore secrets the release APK is published unsigned (not installable) next to the
# installable debug APK.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  SIGNALING_URL: ${{ vars.REMODROID_SIGNALING_URL || 'wss://signal.example.com/ws' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.${GITHUB_RUN_NUMBER}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Tag must look like v1.2.3 (got $GITHUB_REF_NAME)"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Server tests and build
        working-directory: server
        run: npm ci && npm test && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:test :android:app:testDebugUnitTest

  android:
    needs: [version, test]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "REMODROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APKs
        env:
          REMODROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REMODROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REMODROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew :android:app:assembleRelease :android:app:assembleDebug
          -Premodroid.signalingUrl="$SIGNALING_URL"
          -Premodroid.versionName="$VERSION"
          -Premodroid.versionCode="${{ github.run_number }}"
      - name: Collect APKs
        run: |
          mkdir -p dist
          out=android/app/build/outputs/apk
          if [ -f "$out/release/app-release.apk" ]; then
            cp "$out/release/app-release.apk" "dist/RemoDroid-$VERSION.apk"
          else
            cp "$out/release/app-release-unsigned.apk" "dist/RemoDroid-$VERSION-unsigned.apk"
          fi
          cp "$out/debug/app-debug.apk" "dist/RemoDroid-$VERSION-debug.apk"
          (cd dist && sha256sum * > SHA256SUMS-android.txt)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  windows:
    needs: [version, test]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build portable app
        shell: bash
        run: ./gradlew :windows:createDistributable -Premodroid.versionName="$VERSION"
      - name: Zip portable app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path windows/build/compose/binaries/main/app/RemoDroid/* -DestinationPath "dist/RemoDroid-$env:VERSION-windows-x64.zip"
      - name: Build MSI installer
        id: msi
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew :windows:packageMsi -Premodroid.versionName="$VERSION"
          cp windows/build/compose/binaries/main/msi/*.msi "dist/RemoDroid-$VERSION-windows-x64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.VERSION) }}
          name: RemoDroid ${{ env.VERSION }}
          draft: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: dist/*
          body: |
            **Downloads**
            * `RemoDroid-${{ env.VERSION }}.apk` – signed Android release (only when signing secrets are configured; otherwise an unsigned file is attached, which Android will not install).
            * `RemoDroid-${{ env.VERSION }}-debug.apk` – installable Android test build (allows `ws://` servers).
            * `RemoDroid-${{ env.VERSION }}-windows-x64.zip` – portable Windows app; run `RemoDroid.exe`. An `.msi` installer is attached when it built.

            The default signaling server is `${{ env.SIGNALING_URL }}`; change it in each app's Settings.
            You also need the signaling server running (see `docs/deployment.md`).
